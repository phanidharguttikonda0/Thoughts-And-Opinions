spring:
  application:
    name: ThoughtsService

  # 1. DATABASE CONFIGURATION (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/thoughts_db
    username: admin
    password: admin_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000 # 10 minutes in milliseconds
      max-lifetime: 1800000 # 30 minutes in millisecond

  # 2. JPA & HIBERNATE CONFIGURATION
  # Shifted left: now correctly maps to spring.jpa
  jpa:
    hibernate:
      ddl-auto: update

  # 3. gRPC CONFIGURATION
  # Shifted left: now correctly maps to spring.grpc
  grpc:
    server:
      port: 9091

# 4. SNOWFLAKE DISTRIBUTED CONFIGURATION
# (This was already correctly indented at the root level)
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}