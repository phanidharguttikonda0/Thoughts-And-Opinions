version: '3.8'

services:
  # -----------------------------------------
  # 1. PostgreSQL (Relational Databases)
  # -----------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: to_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounts the initialization script to automatically create both databases
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 2. Redis (Caching & Feed/Notification Index)
  # -----------------------------------------
  redis:
    image: redis:latest
    container_name: to_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 3. Apache Kafka (KRaft Mode - No Zookeeper)
  # -----------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: to_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 4. MinIO (Self-Hosted S3 Object Storage)
  # -----------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: to_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 5. Identity Service
  # -----------------------------------------
  identity-service:
    build:
      context: ./IdentityService
      dockerfile: Dockerfile
    container_name: to_identity
    ports:
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://to_postgres:5432/identity_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin_password
    depends_on:
      - postgres
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 6. Thoughts Service
  # -----------------------------------------
  thoughts-service:
    build:
      context: ./ThoughtsService
      dockerfile: Dockerfile
    container_name: to_thoughts
    ports:
      - "9091:9091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://to_postgres:5432/thoughts_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin_password
    depends_on:
      - postgres
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 7. Timeline Service
  # -----------------------------------------
  timeline-service:
    build:
      context: ./timelineservice
      dockerfile: Dockerfile
    container_name: to_timeline
    ports:
      - "8083:8083"
      - "9094:9094"
    environment:
      - REDIS_HOST=to_redis
      - REDIS_PORT=6379
      - KAFKA_HOST=to_kafka
      - KAFKA_PORT=9092
    depends_on:
      - redis
      - kafka
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 8. Notification Service
  # -----------------------------------------
  notification-service:
    build:
      context: ./NotificationService
      dockerfile: Dockerfile
    container_name: to_notification
    ports:
      - "9095:9095"
    environment:
      - REDIS_ADDR=to_redis:6379
      - KAFKA_BROKER=to_kafka:9092
      - GRPC_PORT=9095
    depends_on:
      - redis
      - kafka
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 9. API Gateway
  # -----------------------------------------
  api-gateway:
    build:
      context: ./APIGateway
      dockerfile: Dockerfile
    container_name: to_apigateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_REDIS_HOST=to_redis
      - SPRING_DATA_REDIS_PORT=6379
      - KAFKA_HOST=to_kafka
      - KAFKA_PORT=9092
      - IDENTITY_GRPC_HOST=to_identity
      - THOUGHTS_GRPC_HOST=to_thoughts
      - TIMELINE_GRPC_HOST=to_timeline
      - NOTIFICATION_GRPC_HOST=to_notification
      - MINIO_ENDPOINT=http://to_minio:9000
    depends_on:
      - identity-service
      - thoughts-service
      - timeline-service
      - notification-service
      - redis
      - kafka
      - minio
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 10. Frontend
  # -----------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: to_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - api-gateway
    networks:
      - to_network
    restart: unless-stopped

networks:
  to_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data: