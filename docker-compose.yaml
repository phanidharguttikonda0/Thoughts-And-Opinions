version: '3.8'

services:
  # -----------------------------------------
  # 1. PostgreSQL (Relational Databases)
  # -----------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: to_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mounts the initialization script to automatically create both databases
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 2. Redis (Caching & Feed/Notification Index)
  # -----------------------------------------
  redis:
    image: redis:latest
    container_name: to_redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 3. Apache Kafka (KRaft Mode - No Zookeeper)
  # -----------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: to_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - to_network
    restart: unless-stopped

  # -----------------------------------------
  # 4. MinIO (Self-Hosted S3 Object Storage)
  # -----------------------------------------
  minio:
    image: quay.io/minio/minio
    container_name: to_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin_password
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - to_network
    restart: unless-stopped

networks:
  to_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data: