spring:
  application:
    name: IdentityService

  # 1. DATABASE CONFIGURATION (PostgreSQL)
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: admin
    password: admin_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 600000 # 10 minutes in milliseconds
      max-lifetime: 1800000 # 30 minutes in millisecond

  # 2. JPA & HIBERNATE CONFIGURATION
  jpa:
    hibernate:
      ddl-auto: update

  # 3. gRPC CONFIGURATION
  grpc:
    server:
      port: 9090

  jwt:
    # Use the EXACT same Base64 encoded secret as the APIGateway!
    secret: dGhpcy1pcy1hLXNlY3JldC1rZXktZm9yLWp3dC1zaWduaW5nLWFuZC12YWxpZGF0aW9uLXNob3VsZC1iZS1sb25nLWVub3VnaA==

# 4. SNOWFLAKE DISTRIBUTED CONFIGURATION
# This maps the environment variable when running on Kubernetes/Docker,
# and defaults to '1' when running locally on your laptop.
snowflake:
  worker-id: ${SNOWFLAKE_WORKER_ID:1}
  datacenter-id: ${SNOWFLAKE_DATACENTER_ID:1}
